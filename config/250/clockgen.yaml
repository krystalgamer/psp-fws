  target_path: tmp/baserom/250/clockgen.prx
  elf_path: tmp/build/250/clockgen.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/clockgen
  src_path: src/clockgen
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/clockgen.ld
  cache_path: tmp/build/250/.splat_cache.clockgen
  symbol_addrs_path:
    - config/250/symbol_addrs.clockgen.txt
    - tmp/build/250/prx_syms.clockgen.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.clockgen.txt]
  asset_path: tmp/assets/250/clockgen
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.clockgen.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.clockgen.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8040
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x990

segments:
