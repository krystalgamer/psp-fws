  - name: clockgen
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, clockgen]
      - { start: 0x794, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x7E4, type: prxpad, order: .text }
      - { start: 0x7F0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x7F4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x814, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x818, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x81C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x858, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x85C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x890, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x964, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x98C, rodata, clockgen]
      - { start: 0x9A4, type: prxpad, order: .rodata }
  - name: clockgen_seg1
    type: code
    start: 0x9B0
    vram: 0x930
    subsegments:
      - [0x9B0, data, clockgen_data]
  - [0x9FC, bin, elf_trailer]
