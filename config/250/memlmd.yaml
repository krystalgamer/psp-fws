name: memlmd (250)
sha1: 81e94c02249bc0cc62e0cef6ed8e8d1db159600a
options:
  basename: memlmd
  target_path: tmp/baserom/250/memlmd.prx
  elf_path: tmp/build/250/memlmd.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/memlmd
  src_path: src/memlmd
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/memlmd.ld
  cache_path: tmp/build/250/.splat_cache.memlmd
  symbol_addrs_path:
    - config/250/symbol_addrs.memlmd.txt
    - tmp/build/250/prx_syms.memlmd.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.memlmd.txt]
  asset_path: tmp/assets/250/memlmd
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.memlmd.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.memlmd.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x2890

segments:
  - [0x0, bin, elf_header]
  - name: memlmd
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, memlmd]
      - { start: 0x1614, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x16AC, type: prxpad, order: .text }
      - { start: 0x16B0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x16B4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x16E4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x16E8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x16EC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1740, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1744, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1778, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1854, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x18A0, rodata, memlmd]
      - { start: 0x2408, type: prxpad, order: .rodata }
  - name: memlmd_seg1
    type: code
    start: 0x2440
    vram: 0x23C0
    bss_size: 0x480
    subsegments:
      - [0x2440, data, memlmd_data]
      - { start: 0x2480, type: bss, vram: 0x2400 }
  - [0x2480, bin, elf_trailer]
  - [0x334C]
