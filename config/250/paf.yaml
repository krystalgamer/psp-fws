name: paf (250)
sha1: b6a78088e59e22b918d1aa5c51ebcaa5f986fefd
options:
  basename: paf
  target_path: tmp/baserom/250/paf.prx
  elf_path: tmp/build/250/paf.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/paf
  src_path: src/paf
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/paf.ld
  cache_path: tmp/build/250/.splat_cache.paf
  symbol_addrs_path:
    - config/250/symbol_addrs.paf.txt
    - tmp/build/250/prx_syms.paf.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.paf.txt]
  asset_path: tmp/assets/250/paf
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.paf.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.paf.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0xA250
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1EA5BC

segments:
  - [0x0, bin, elf_header]
  - name: paf
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - { start: 0x80, type: asm, name: init, linker_section: .init }
      - { start: 0xA4, type: prxpad, order: .text }
      - [0xB0, asm, paf]
      - { start: 0x165550, type: asm, name: fini, linker_section: .fini }
      - { start: 0x16556C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x16586C, type: prxpad, order: .text }
      - { start: 0x165870, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x165874, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x165894, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x165898, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x16589C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1659DC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1659E0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x165A14, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x167794, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - { start: 0x167914, type: rodata, name: ctors, linker_section: .ctors }
      - { start: 0x167978, type: rodata, name: dtors, linker_section: .dtors }
      - { start: 0x1679C8, type: rodata, name: jcr, linker_section: .jcr }
      - { start: 0x1679CC, type: rodata, name: eh_frame, linker_section: .eh_frame }
      - { start: 0x1679D0, type: prxpad, order: .rodata }
      - [0x167A00, rodata, paf]
      - { start: 0x19B120, type: prxpad, order: .rodata }
  - name: paf_seg1
    type: code
    start: 0x19B140
    vram: 0x19B0C0
    bss_size: 0x4D298
    subsegments:
      - [0x19B140, data, paf_data]
      - { start: 0x19D394, type: bss, vram: 0x19D340 }
  - [0x19D394, bin, elf_trailer]
  - [0x20E982]
