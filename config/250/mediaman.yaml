name: mediaman (250)
sha1: 8f729c0650eeb166d91b713fe50ec59ea6c77eab
options:
  basename: mediaman
  target_path: tmp/baserom/250/mediaman.prx
  elf_path: tmp/build/250/mediaman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/mediaman
  src_path: src/mediaman
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/mediaman.ld
  cache_path: tmp/build/250/.splat_cache.mediaman
  symbol_addrs_path:
    - config/250/symbol_addrs.mediaman.txt
    - tmp/build/250/prx_syms.mediaman.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.mediaman.txt]
  asset_path: tmp/assets/250/mediaman
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.mediaman.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.mediaman.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x7FF0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1320

segments:
  - [0x0, bin, elf_header]
  - name: mediaman
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, mediaman]
      - { start: 0xF10, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xF98, type: prxpad, order: .text }
      - { start: 0xFA0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xFA4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xFD4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xFD8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xFDC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1044, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1048, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x107C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x12A4, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x12E8, .rodata, mediaman]
      - { start: 0x1318, type: prxpad, order: .rodata }
  - name: mediaman_seg1
    type: code
    start: 0x1320
    vram: 0x12A0
    bss_size: 0x70
    subsegments:
      - { start: 0x1320, type: bss, vram: 0x12A0 }
  - [0x1320, bin, elf_trailer]
  - [0x20D0]
