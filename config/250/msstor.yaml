name: msstor (250)
sha1: a61d5cc26266e18f01e09909ca3db86b9f0b216e
options:
  basename: msstor
  target_path: tmp/baserom/250/msstor.prx
  elf_path: tmp/build/250/msstor.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/msstor
  src_path: src/msstor
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/msstor.ld
  cache_path: tmp/build/250/.splat_cache.msstor
  symbol_addrs_path:
    - config/250/symbol_addrs.msstor.txt
    - tmp/build/250/prx_syms.msstor.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.msstor.txt]
  asset_path: tmp/assets/250/msstor
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.msstor.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.msstor.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x81B0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xEC98

segments:
  - [0x0, bin, elf_header]
  - name: msstor
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, msstor]
      - { start: 0x8FA0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x9178, type: prxpad, order: .text }
      - { start: 0x9180, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x9184, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x91A4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x91A8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x91AC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x923C, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x9240, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x9274, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x9358, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x9444, rodata, msstor]
      - { start: 0x9CA8, type: prxpad, order: .rodata }
  - name: msstor_seg1
    type: code
    start: 0x9CB0
    vram: 0x9C30
    bss_size: 0x4E9C
    subsegments:
      - [0x9CB0, data, msstor_data]
      - { start: 0x9E6C, type: bss, vram: 0x9DF0 }
  - [0x9E6C, bin, elf_trailer]
  - [0xCA9C]
