      - { start: 0xFBC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xFC0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xFF4, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x10E0, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1110, .rodata, videocodec]
      - { start: 0x113C, type: prxpad, order: .rodata }
