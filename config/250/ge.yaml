      - { start: 0x54D4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x54D8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x54DC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x5594, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x5598, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x55CC, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x585C, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x58F8, rodata, ge]
      - { start: 0x5DFC, type: prxpad, order: .rodata }
