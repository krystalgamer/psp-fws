options:
  basename: ge
  target_path: tmp/baserom/250/ge.prx
  elf_path: tmp/build/250/ge.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/ge
  src_path: src/ge
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/ge.ld
  cache_path: tmp/build/250/.splat_cache.ge
  symbol_addrs_path:
