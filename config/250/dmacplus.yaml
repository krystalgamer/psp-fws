name: dmacplus (250)
sha1: c0e9527ec18e8dc00096b4fa0253709c5464076a
options:
  basename: dmacplus
  target_path: tmp/baserom/250/dmacplus.prx
  elf_path: tmp/build/250/dmacplus.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/dmacplus
  src_path: src/dmacplus
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/dmacplus.ld
  cache_path: tmp/build/250/.splat_cache.dmacplus
  symbol_addrs_path:
    - config/250/symbol_addrs.dmacplus.txt
    - tmp/build/250/prx_syms.dmacplus.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.dmacplus.txt]
  asset_path: tmp/assets/250/dmacplus
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.dmacplus.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.dmacplus.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x402C

segments:
  - [0x0, bin, elf_header]
  - name: dmacplus
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, dmacplus]
      - { start: 0x2A08, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x2AE8, type: prxpad, order: .text }
      - { start: 0x2AF0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x2AF4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x2B24, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x2B28, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x2B2C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x2B94, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x2B98, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x2BCC, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x2E3C, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x2EAC, .rodata, dmacplus]
      - { start: 0x2F3C, type: prxpad, order: .rodata }
  - name: dmacplus_seg1
    type: code
    start: 0x2F40
    vram: 0x2EC0
    bss_size: 0x111C
    subsegments:
      - [0x2F40, data, dmacplus_data]
      - { start: 0x2F80, type: bss, vram: 0x2F00 }
  - [0x2F80, bin, elf_trailer]
  - [0x47BC]
