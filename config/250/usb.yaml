name: usb (250)
sha1: aa2d24f193de96a90a0e22a61c5d2c85bc8d6288
options:
  basename: usb
  target_path: tmp/baserom/250/usb.prx
  elf_path: tmp/build/250/usb.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/usb
  src_path: src/usb
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/usb.ld
  cache_path: tmp/build/250/.splat_cache.usb
  symbol_addrs_path:
    - config/250/symbol_addrs.usb.txt
    - tmp/build/250/prx_syms.usb.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.usb.txt]
  asset_path: tmp/assets/250/usb
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.usb.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.usb.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8200
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xB1E0

segments:
  - [0x0, bin, elf_header]
  - name: usb
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, usb]
      - { start: 0x8CD8, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x8E90, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x8E94, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x8ED4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x8ED8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x8EDC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x8FBC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x8FC0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x8FF4, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x9254, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x9330, rodata, usb]
      - { start: 0xAC28, type: prxpad, order: .rodata }
  - name: usb_seg1
    type: code
    start: 0xAC40
    vram: 0xABC0
    bss_size: 0x404
    subsegments:
      - [0xAC40, data, usb_data]
      - { start: 0xAE4C, type: bss, vram: 0xAE00 }
  - [0xAE4C, bin, elf_trailer]
  - [0xEF20]
