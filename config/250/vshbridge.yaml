name: vshbridge (250)
sha1: 5aae1d916989a1f1d78c58ce1114cd2b4c00496e
options:
  basename: vshbridge
  target_path: tmp/baserom/250/vshbridge.prx
  elf_path: tmp/build/250/vshbridge.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/vshbridge
  src_path: src/vshbridge
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/vshbridge.ld
  cache_path: tmp/build/250/.splat_cache.vshbridge
  symbol_addrs_path:
    - config/250/symbol_addrs.vshbridge.txt
    - tmp/build/250/prx_syms.vshbridge.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.vshbridge.txt]
  asset_path: tmp/assets/250/vshbridge
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.vshbridge.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.vshbridge.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x3760

segments:
  - [0x0, bin, elf_header]
  - name: vshbridge
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, vshbridge]
      - { start: 0x2AE8, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x2E20, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x2E24, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x2E54, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x2E58, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x2E5C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x3028, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x302C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x3060, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x3590, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x372C, rodata, vshbridge]
      - { start: 0x3778, type: prxpad, order: .rodata }
  - name: vshbridge_seg1
    type: code
    start: 0x3780
    vram: 0x3700
    bss_size: 0x10
    subsegments:
      - [0x3780, data, vshbridge_data]
      - { start: 0x37C0, type: bss, vram: 0x3740 }
  - [0x37C0, bin, elf_trailer]
  - [0x4DAC]
