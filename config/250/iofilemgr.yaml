name: iofilemgr (250)
sha1: 565665a7c4d405bbd9d5e857ebd66eff63011989
options:
  basename: iofilemgr
  target_path: tmp/baserom/250/iofilemgr.prx
  elf_path: tmp/build/250/iofilemgr.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/iofilemgr
  src_path: src/iofilemgr
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/iofilemgr.ld
  cache_path: tmp/build/250/.splat_cache.iofilemgr
  symbol_addrs_path:
