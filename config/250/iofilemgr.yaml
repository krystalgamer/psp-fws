      - { start: 0x4350, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x4354, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x4384, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
