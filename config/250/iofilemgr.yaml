      - { start: 0x438C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x4408, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x440C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x4440, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x4798, type: rodata, name: nid, linker_section: .rodata.sceNid }
