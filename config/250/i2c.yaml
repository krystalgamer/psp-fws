name: i2c (250)
sha1: 0cd53d818a05f66586925f808db45bf628e40abd
options:
  basename: i2c
  target_path: tmp/baserom/250/i2c.prx
  elf_path: tmp/build/250/i2c.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/i2c
  src_path: src/i2c
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/i2c.ld
  cache_path: tmp/build/250/.splat_cache.i2c
  symbol_addrs_path:
    - config/250/symbol_addrs.i2c.txt
    - tmp/build/250/prx_syms.i2c.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.i2c.txt]
  asset_path: tmp/assets/250/i2c
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.i2c.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.i2c.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x175C

segments:
  - [0x0, bin, elf_header]
  - name: i2c
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, i2c]
      - { start: 0x14D0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x1568, type: prxpad, order: .text }
      - { start: 0x1570, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1574, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1594, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1598, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x159C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x15F0, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x15F4, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1628, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1714, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1760, .rodata, i2c]
      - { start: 0x1768, type: prxpad, order: .rodata }
  - name: i2c_seg1
    type: code
    start: 0x1770
    vram: 0x16F0
    bss_size: 0x1C
    subsegments:
      - [0x1770, data, i2c_data]
      - { start: 0x17B0, type: bss, vram: 0x1730 }
  - [0x17B0, bin, elf_trailer]
  - [0x26D4]
