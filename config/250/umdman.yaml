name: umdman (250)
sha1: 33eb63e8ca3fe4e593387775dee63b8d73d151d1
options:
  basename: umdman
  target_path: tmp/baserom/250/umdman.prx
  elf_path: tmp/build/250/umdman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/umdman
  src_path: src/umdman
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/umdman.ld
  cache_path: tmp/build/250/.splat_cache.umdman
  symbol_addrs_path:
    - config/250/symbol_addrs.umdman.txt
    - tmp/build/250/prx_syms.umdman.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.umdman.txt]
  asset_path: tmp/assets/250/umdman
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.umdman.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.umdman.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8080
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1C9CC

segments:
  - [0x0, bin, elf_header]
  - name: umdman
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, umdman]
      - { start: 0x107BC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x10BAC, type: prxpad, order: .text }
      - { start: 0x10BB0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x10BB4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x10BD4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x10BD8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x10BDC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x10D34, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x10D38, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x10D6C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1116C, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x11364, rodata, umdman]
      - { start: 0x1245C, type: prxpad, order: .rodata }
  - name: umdman_seg1
    type: code
    start: 0x12480
    vram: 0x12400
    bss_size: 0xA52C
    subsegments:
      - [0x12480, data, umdman_data]
      - { start: 0x12510, type: bss, vram: 0x124C0 }
  - [0x12510, bin, elf_trailer]
  - [0x1A624]
