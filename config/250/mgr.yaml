name: mgr (250)
sha1: 08bedce7f61d748cbd29dca8585c1a3d4efae8c4
options:
  basename: mgr
  target_path: tmp/baserom/250/mgr.prx
  elf_path: tmp/build/250/mgr.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/mgr
  src_path: src/mgr
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/mgr.ld
  cache_path: tmp/build/250/.splat_cache.mgr
  symbol_addrs_path:
    - config/250/symbol_addrs.mgr.txt
    - tmp/build/250/prx_syms.mgr.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.mgr.txt]
  asset_path: tmp/assets/250/mgr
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.mgr.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.mgr.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8690
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xBC50

segments:
  - [0x0, bin, elf_header]
  - name: mgr
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, mgr]
      - { start: 0xA870, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xA9F0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xA9F4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xAA14, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xAA18, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xAA1C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xAAD4, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xAAD8, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xAB0C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xAEA8, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - { start: 0xAF68, type: prxpad, order: .rodata }
      - [0xAF70, .rodata, mgr]
      - { start: 0xB0F4, type: prxpad, order: .rodata }
  - name: mgr_seg1
    type: code
    start: 0xB100
    vram: 0xB080
    bss_size: 0x528
    subsegments:
      - [0xB100, data, mgr_data]
      - { start: 0xB798, type: bss, vram: 0xB720 }
  - [0xB798, bin, elf_trailer]
  - [0xF000]
