name: rtc (250)
sha1: 7bd912d5fc80b71c82f86d11638fb07f7ad11a36
options:
  basename: rtc
  target_path: tmp/baserom/250/rtc.prx
  elf_path: tmp/build/250/rtc.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/rtc
  src_path: src/rtc
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/rtc.ld
  cache_path: tmp/build/250/.splat_cache.rtc
  symbol_addrs_path:
    - config/250/symbol_addrs.rtc.txt
    - tmp/build/250/prx_syms.rtc.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.rtc.txt]
  asset_path: tmp/assets/250/rtc
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.rtc.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.rtc.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4138

segments:
  - [0x0, bin, elf_header]
  - name: rtc
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, rtc]
      - { start: 0x3AF8, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x3B80, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x3B84, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x3BB4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x3BB8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x3BBC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x3C60, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x3C64, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x3C98, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x4064, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x40A8, rodata, rtc]
      - { start: 0x4108, type: prxpad, order: .rodata }
  - name: rtc_seg1
    type: code
    start: 0x4110
    vram: 0x4090
    bss_size: 0x58
    subsegments:
      - [0x4110, data, rtc_data]
      - { start: 0x4150, type: bss, vram: 0x40D0 }
  - [0x4150, bin, elf_trailer]
  - [0x582C]
