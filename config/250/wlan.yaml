name: wlan (250)
sha1: 2dc6c1dade7561e140f25f85bc27cf97aa5cc1df
options:
  basename: wlan
  target_path: tmp/baserom/250/wlan.prx
  elf_path: tmp/build/250/wlan.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/250/wlan
  src_path: src/wlan
  build_path: tmp/build/250
  ld_script_path: tmp/build/250/wlan.ld
  cache_path: tmp/build/250/.splat_cache.wlan
  symbol_addrs_path:
    - config/250/symbol_addrs.wlan.txt
    - tmp/build/250/prx_syms.wlan.txt
  reloc_addrs_path: [tmp/build/250/reloc_addrs.wlan.txt]
  asset_path: tmp/assets/250/wlan
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/250/undefined_funcs_auto.wlan.txt
  undefined_syms_auto_path: tmp/build/250/undefined_syms_auto.wlan.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x2F67C

segments:
  - [0x0, bin, elf_header]
  - name: wlan
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, wlan]
      - { start: 0x16A30, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x16D70, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x16D74, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x16DB4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x16DB8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x16DBC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x16EB0, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x16EB4, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x16EE8, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x171FC, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1739C, rodata, wlan]
      - { start: 0x2ED7C, type: prxpad, order: .rodata }
  - name: wlan_seg1
    type: code
    start: 0x2ED80
    vram: 0x2ED00
    bss_size: 0x92C
    subsegments:
      - [0x2ED80, data, wlan_data]
      - { start: 0x2EDC0, type: bss, vram: 0x2ED40 }
  - [0x2EDC0, bin, elf_trailer]
  - [0x35A50]
