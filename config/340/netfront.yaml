  target_path: tmp/baserom/340/netfront.prx
  elf_path: tmp/build/340/netfront.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/340/netfront
  src_path: src/netfront
  build_path: tmp/build/340
  ld_script_path: tmp/build/340/netfront.ld
  cache_path: tmp/build/340/.splat_cache.netfront
