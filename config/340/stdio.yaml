options:
  basename: stdio
  target_path: tmp/baserom/340/stdio.prx
  elf_path: tmp/build/340/stdio.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/340/stdio
  src_path: src/stdio
  build_path: tmp/build/340
  ld_script_path: tmp/build/340/stdio.ld
  cache_path: tmp/build/340/.splat_cache.stdio
  symbol_addrs_path:
