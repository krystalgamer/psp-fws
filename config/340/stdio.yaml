      - { start: 0x107C, type: prxpad, order: .text }
      - { start: 0x1080, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1084, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1094, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1098, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x109C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1100, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1104, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1138, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x11C0, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1210, rodata, stdio]
      - { start: 0x12E8, type: prxpad, order: .rodata }
  - name: stdio_seg1
    type: code
    start: 0x12F0
    vram: 0x1250
    bss_size: 0x20
