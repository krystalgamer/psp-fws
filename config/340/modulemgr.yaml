name: modulemgr (340)
sha1: 3c23b96a62d23ec3ddca2ea72d8b58c50ff70e15
options:
  basename: modulemgr
  target_path: tmp/baserom/340/modulemgr.prx
  elf_path: tmp/build/340/modulemgr.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/340/modulemgr
  src_path: src/modulemgr
  build_path: tmp/build/340
  ld_script_path: tmp/build/340/modulemgr.ld
  cache_path: tmp/build/340/.splat_cache.modulemgr
  symbol_addrs_path:
    - config/340/symbol_addrs.modulemgr.txt
    - tmp/build/340/prx_syms.modulemgr.txt
  reloc_addrs_path: [tmp/build/340/reloc_addrs.modulemgr.txt]
  asset_path: tmp/assets/340/modulemgr
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/340/undefined_funcs_auto.modulemgr.txt
  undefined_syms_auto_path: tmp/build/340/undefined_syms_auto.modulemgr.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x8510

segments:
  - [0x0, bin, elf_header]
  - name: modulemgr
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, modulemgr]
      - { start: 0x72E4, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x7524, type: prxpad, order: .text }
      - { start: 0x7530, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x7534, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x756C, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x7570, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x7574, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x7618, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x761C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x7650, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x798C, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x7AAC, rodata, modulemgr]
  - name: modulemgr_seg1
    type: code
    start: 0x8570
    vram: 0x84D0
    bss_size: 0x2C
    subsegments:
      - [0x8570, data, modulemgr_data]
      - { start: 0x8574, type: bss, vram: 0x84E0 }
  - [0x8574, bin, elf_trailer]
  - [0xAB0C]
