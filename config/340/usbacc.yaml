name: usbacc (340)
sha1: 38f73c395b1d54fff151b4d0e206d8e36c192c48
options:
  basename: usbacc
  target_path: tmp/baserom/340/usbacc.prx
  elf_path: tmp/build/340/usbacc.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/340/usbacc
  src_path: src/usbacc
  build_path: tmp/build/340
  ld_script_path: tmp/build/340/usbacc.ld
  cache_path: tmp/build/340/.splat_cache.usbacc
  symbol_addrs_path:
    - config/340/symbol_addrs.usbacc.txt
    - tmp/build/340/prx_syms.usbacc.txt
  reloc_addrs_path: [tmp/build/340/reloc_addrs.usbacc.txt]
  asset_path: tmp/assets/340/usbacc
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/340/undefined_funcs_auto.usbacc.txt
  undefined_syms_auto_path: tmp/build/340/undefined_syms_auto.usbacc.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x80E0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1024

segments:
  - [0x0, bin, elf_header]
  - name: usbacc
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, c, usbacc]
      - { start: 0xA4C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xAD4, type: prxpad, order: .text }
      - { start: 0xAE0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xAE4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xB24, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xB28, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xB2C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xB94, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xB98, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xBCC, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xCE0, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0xD24, .rodata, usbacc]
  - name: usbacc_seg1
    type: code
    start: 0xF80
    vram: 0xEE0
    bss_size: 0x48
    subsegments:
      - [0xF80, data, usbacc_data]
      - { start: 0x106C, type: bss, vram: 0xFD0 }
  - [0x106C, bin, elf_trailer]
