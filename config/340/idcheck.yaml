name: idcheck (340)
sha1: c0b702663315a06df854f3fdb52feec10889e945
options:
  basename: idcheck
  target_path: tmp/baserom/340/idcheck.prx
  elf_path: tmp/build/340/idcheck.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/340/idcheck
  src_path: src/idcheck
  build_path: tmp/build/340
  ld_script_path: tmp/build/340/idcheck.ld
  cache_path: tmp/build/340/.splat_cache.idcheck
  symbol_addrs_path:
    - config/340/symbol_addrs.idcheck.txt
    - tmp/build/340/prx_syms.idcheck.txt
  reloc_addrs_path: [tmp/build/340/reloc_addrs.idcheck.txt]
  asset_path: tmp/assets/340/idcheck
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/340/undefined_funcs_auto.idcheck.txt
  undefined_syms_auto_path: tmp/build/340/undefined_syms_auto.idcheck.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8050
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x12E0

segments:
  - [0x0, bin, elf_header]
  - name: idcheck
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, c, idcheck]
      - { start: 0xFDC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x107C, type: prxpad, order: .text }
      - { start: 0x1080, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1084, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1094, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1098, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x109C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1100, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1104, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1138, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x11C0, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1210, .rodata, idcheck]
      - { start: 0x12E8, type: prxpad, order: .rodata }
  - name: idcheck_seg1
    type: code
    start: 0x12F0
    vram: 0x1250
    bss_size: 0x2C
    subsegments:
      - [0x12F0, data, idcheck_data]
      - { start: 0x1344, type: bss, vram: 0x12B0 }
  - [0x1344, bin, elf_trailer]
  - [0x203C]
