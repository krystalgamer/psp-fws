      - { start: 0xCA8, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xCAC, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xCB0, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xD04, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xD08, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xD3C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xE88, type: rodata, name: nid, linker_section: .rodata.sceNid }
