  target_path: tmp/baserom/282/lcdc.prx
  elf_path: tmp/build/282/lcdc.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/282/lcdc
  src_path: src/lcdc
  build_path: tmp/build/282
  ld_script_path: tmp/build/282/lcdc.ld
  cache_path: tmp/build/282/.splat_cache.lcdc
  symbol_addrs_path:
