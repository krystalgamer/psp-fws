  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/282/dmacman
  src_path: src/dmacman
  build_path: tmp/build/282
  ld_script_path: tmp/build/282/dmacman.ld
  cache_path: tmp/build/282/.splat_cache.dmacman
  symbol_addrs_path:
