name: mgr (151)
sha1: 4c3bfb484f7b0cb1aadd143ab82d9bd6021cf071
options:
  basename: mgr
  target_path: tmp/baserom/151/mgr.prx
  elf_path: tmp/build/151/mgr.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/151/mgr
  src_path: src/mgr
  build_path: tmp/build/151
  ld_script_path: tmp/build/151/mgr.ld
  cache_path: tmp/build/151/.splat_cache.mgr
  symbol_addrs_path:
    - config/151/symbol_addrs.mgr.txt
    - tmp/build/151/prx_syms.mgr.txt
  reloc_addrs_path: [tmp/build/151/reloc_addrs.mgr.txt]
  asset_path: tmp/assets/151/mgr
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/151/undefined_funcs_auto.mgr.txt
  undefined_syms_auto_path: tmp/build/151/undefined_syms_auto.mgr.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8690
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xA130

segments:
  - [0x0, bin, elf_header]
  - name: mgr
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, mgr]
      - { start: 0x8EE0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x9040, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x9044, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x9064, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x9068, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x906C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x910C, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x9110, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x9144, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x9444, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - { start: 0x94F4, type: prxpad, order: .rodata }
      - [0x94F8, rodata, mgr]
  - name: mgr_seg1
    type: code
    start: 0x95F0
    vram: 0x9570
    bss_size: 0x518
