name: modulemgr (350)
sha1: 1e6bbbec70fc290cb4dfbfce61ffbcb22e2825f9
options:
  basename: modulemgr
  target_path: tmp/baserom/350/modulemgr.prx
  elf_path: tmp/build/350/modulemgr.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/350/modulemgr
  src_path: src/modulemgr
  build_path: tmp/build/350
  ld_script_path: tmp/build/350/modulemgr.ld
  cache_path: tmp/build/350/.splat_cache.modulemgr
  symbol_addrs_path:
    - config/350/symbol_addrs.modulemgr.txt
    - tmp/build/350/prx_syms.modulemgr.txt
  reloc_addrs_path: [tmp/build/350/reloc_addrs.modulemgr.txt]
  asset_path: tmp/assets/350/modulemgr
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/350/undefined_funcs_auto.modulemgr.txt
  undefined_syms_auto_path: tmp/build/350/undefined_syms_auto.modulemgr.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x8810

segments:
  - [0x0, bin, elf_header]
  - name: modulemgr
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, modulemgr]
      - { start: 0x7958, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x7B98, type: prxpad, order: .text }
      - { start: 0x7BA0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x7BA4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x7BDC, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x7BE0, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x7BE4, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x7C88, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x7C8C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - [0x7CC0, rodata, modulemgr]
      - { start: 0x8868, type: prxpad, order: .rodata }
  - name: modulemgr_seg1
    type: code
    start: 0x8870
    vram: 0x87D0
    bss_size: 0x2C
    subsegments:
      - [0x8870, data, modulemgr_data]
      - { start: 0x8874, type: bss, vram: 0x87D4 }
  - [0x8874, bin, elf_trailer]
  - [0xA810]
