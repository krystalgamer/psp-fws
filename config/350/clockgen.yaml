  - name: clockgen
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, clockgen]
      - { start: 0x7CC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x81C, type: prxpad, order: .text }
      - { start: 0x820, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x824, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x844, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x848, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x84C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x888, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x88C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - [0x8C0, rodata, clockgen]
      - { start: 0x9DC, type: prxpad, order: .rodata }
  - name: clockgen_seg1
    type: code
    start: 0x9E0
    vram: 0x940
    bss_size: 0xC
    subsegments:
      - [0x9E0, data, clockgen_data]
      - { start: 0xA34, type: bss, vram: 0x994 }
  - [0xA34, bin, elf_trailer]
