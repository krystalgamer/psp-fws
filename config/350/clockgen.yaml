  target_path: tmp/baserom/350/clockgen.prx
  elf_path: tmp/build/350/clockgen.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/350/clockgen
  src_path: src/clockgen
  build_path: tmp/build/350
  ld_script_path: tmp/build/350/clockgen.ld
  cache_path: tmp/build/350/.splat_cache.clockgen
  symbol_addrs_path:
