name: mscm (303)
sha1: 2e18000f0e61914c9b4cd2d825e046616dfb6524
options:
  basename: mscm
  target_path: tmp/baserom/303/mscm.prx
  elf_path: tmp/build/303/mscm.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/303/mscm
  src_path: src/mscm
  build_path: tmp/build/303
  ld_script_path: tmp/build/303/mscm.ld
  cache_path: tmp/build/303/.splat_cache.mscm
  symbol_addrs_path:
    - config/303/symbol_addrs.mscm.txt
    - tmp/build/303/prx_syms.mscm.txt
  reloc_addrs_path: [tmp/build/303/reloc_addrs.mscm.txt]
  asset_path: tmp/assets/303/mscm
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/303/undefined_funcs_auto.mscm.txt
  undefined_syms_auto_path: tmp/build/303/undefined_syms_auto.mscm.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8040
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x7B10

segments:
  - [0x0, bin, elf_header]
  - name: mscm
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, mscm]
      - { start: 0x69E0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x6C48, type: prxpad, order: .text }
      - { start: 0x6C50, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x6C54, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x6C78, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x6C7C, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x6C80, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x6D74, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x6D78, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x6DAC, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x7094, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x71C8, rodata, mscm]
      - { start: 0x73BC, type: prxpad, order: .rodata }
  - name: mscm_seg1
    type: code
    start: 0x73C0
    vram: 0x7320
    bss_size: 0x798
    subsegments:
      - [0x73C0, data, mscm_data]
      - { start: 0x7408, type: bss, vram: 0x7370 }
  - [0x7408, bin, elf_trailer]
  - [0x9EBC]
