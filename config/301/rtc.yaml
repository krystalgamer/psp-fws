name: rtc (301)
sha1: a538bd9f852e20fd554d6ad8bda76a8b78fd0c88
options:
  basename: rtc
  target_path: tmp/baserom/301/rtc.prx
  elf_path: tmp/build/301/rtc.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/301/rtc
  src_path: src/rtc
  build_path: tmp/build/301
  ld_script_path: tmp/build/301/rtc.ld
  cache_path: tmp/build/301/.splat_cache.rtc
  symbol_addrs_path:
    - config/301/symbol_addrs.rtc.txt
    - tmp/build/301/prx_syms.rtc.txt
  reloc_addrs_path: [tmp/build/301/reloc_addrs.rtc.txt]
  asset_path: tmp/assets/301/rtc
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/301/undefined_funcs_auto.rtc.txt
  undefined_syms_auto_path: tmp/build/301/undefined_syms_auto.rtc.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8040
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4720

segments:
  - [0x0, bin, elf_header]
  - name: rtc
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, c, rtc]
      - { start: 0x3D58, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x3E10, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x3E14, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x3E4C, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x3E50, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x3E54, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x3F0C, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x3F10, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x3F44, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x43A4, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x4400, .rodata, rtc]
  - name: rtc_seg1
    type: code
    start: 0x4700
    vram: 0x4660
    bss_size: 0x6C
    subsegments:
      - [0x4700, data, rtc_data]
      - { start: 0x4744, type: bss, vram: 0x46B0 }
  - [0x4744, bin, elf_trailer]
  - [0x5F58]
