name: peq (100)
sha1: e1cf1aa9a95567d094ba632d3bc6a317317f908b
options:
  basename: peq
  target_path: tmp/baserom/100/peq.prx
  elf_path: tmp/build/100/peq.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/peq
  src_path: src/peq
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/peq.ld
  cache_path: tmp/build/100/.splat_cache.peq
  symbol_addrs_path:
    - config/100/symbol_addrs.peq.txt
    - tmp/build/100/prx_syms.peq.txt
  reloc_addrs_path: [tmp/build/100/reloc_addrs.peq.txt]
  asset_path: tmp/assets/100/peq
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/100/undefined_funcs_auto.peq.txt
  undefined_syms_auto_path: tmp/build/100/undefined_syms_auto.peq.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x7FF0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x440

segments:
  - [0x0, bin, elf_header]
  - name: peq
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, peq]
      - { start: 0x32C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x34C, type: prxpad, order: .text }
      - { start: 0x350, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x354, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x384, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x388, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x38C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x3B4, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x3B8, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x3EC, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x478, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x488, rodata, peq]
      - { start: 0x4A4, type: prxpad, order: .rodata }
  - [0x4B0, bin, elf_trailer]
  - [0xB90]
