name: sm1 (100)
sha1: 54ff4f7d638f566eb6527a6c444f2fe46b83e863
options:
  basename: sm1
  target_path: tmp/baserom/100/sm1.prx
  elf_path: tmp/build/100/sm1.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/sm1
  src_path: src/sm1
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/sm1.ld
  cache_path: tmp/build/100/.splat_cache.sm1
  symbol_addrs_path:
    - config/100/symbol_addrs.sm1.txt
    - tmp/build/100/prx_syms.sm1.txt
  reloc_addrs_path: [tmp/build/100/reloc_addrs.sm1.txt]
  asset_path: tmp/assets/100/sm1
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/100/undefined_funcs_auto.sm1.txt
  undefined_syms_auto_path: tmp/build/100/undefined_syms_auto.sm1.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x7FF0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4D4

segments:
  - [0x0, bin, elf_header]
  - name: sm1
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, sm1]
      - { start: 0x3F4, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x414, type: prxpad, order: .text }
      - { start: 0x420, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x424, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x434, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x438, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x43C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x464, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x468, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x49C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x4E8, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x4F8, rodata, sm1]
      - { start: 0x528, type: prxpad, order: .rodata }
  - name: sm1_seg1
    type: code
    start: 0x530
    vram: 0x4B0
    bss_size: 0x14
    subsegments:
      - { start: 0x530, type: bss, vram: 0x4B0 }
  - [0x530, bin, elf_trailer]
  - [0xC84]
