name: memlmd (100)
sha1: d52d58e51d28218d5e753350aa4ebac397422809
options:
  basename: memlmd
  target_path: tmp/baserom/100/memlmd.prx
  elf_path: tmp/build/100/memlmd.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/memlmd
  src_path: src/memlmd
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/memlmd.ld
  cache_path: tmp/build/100/.splat_cache.memlmd
  symbol_addrs_path:
    - config/100/symbol_addrs.memlmd.txt
    - tmp/build/100/prx_syms.memlmd.txt
  reloc_addrs_path: [tmp/build/100/reloc_addrs.memlmd.txt]
  asset_path: tmp/assets/100/memlmd
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/100/undefined_funcs_auto.memlmd.txt
  undefined_syms_auto_path: tmp/build/100/undefined_syms_auto.memlmd.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1690

segments:
  - [0x0, bin, elf_header]
  - name: memlmd
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, memlmd]
      - { start: 0x10E0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x1170, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1174, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x11A4, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x11F4, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1228, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x12EC, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1334, rodata, memlmd]
      - { start: 0x146C, type: prxpad, order: .rodata }
  - name: memlmd_seg1
    type: code
    start: 0x1480
    vram: 0x13F0
    bss_size: 0x250
    subsegments:
      - [0x1480, data, memlmd_data]
      - { start: 0x14C0, type: bss, vram: 0x1440 }
  - [0x14C0, bin, elf_trailer]
  - [0x20B4]
