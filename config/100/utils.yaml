  undefined_syms_auto_path: tmp/build/100/undefined_syms_auto.utils.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8050
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4780

segments:
  - [0x0, bin, elf_header]
  - name: utils
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, utils]
      - { start: 0x3A50, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x3AA0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x3AA4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x3AD4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x3AD8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x3ADC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x3B2C, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x3B30, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x3B64, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x3DEC, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - { start: 0x3E14, type: prxpad, order: .rodata }
      - [0x3E40, rodata, utils]
  - name: utils_seg1
    type: code
    start: 0x4780
    vram: 0x4700
    bss_size: 0x18
    subsegments:
      - [0x4780, data, utils_data]
      - { start: 0x47D8, type: bss, vram: 0x4760 }
  - [0x47D8, bin, elf_trailer]
  - [0x60E0]
