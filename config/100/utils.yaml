  target_path: tmp/baserom/100/utils.prx
  elf_path: tmp/build/100/utils.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/utils
  src_path: src/utils
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/utils.ld
  cache_path: tmp/build/100/.splat_cache.utils
  symbol_addrs_path:
    - config/100/symbol_addrs.utils.txt
    - tmp/build/100/prx_syms.utils.txt
  reloc_addrs_path: [tmp/build/100/reloc_addrs.utils.txt]
  asset_path: tmp/assets/100/utils
