name: isofs (100)
sha1: 6f4f5d32af0f421acc809a1734ff8e6d2973236a
options:
  basename: isofs
  target_path: tmp/baserom/100/isofs.prx
  elf_path: tmp/build/100/isofs.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/isofs
  src_path: src/isofs
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/isofs.ld
  cache_path: tmp/build/100/.splat_cache.isofs
  symbol_addrs_path:
    - config/100/symbol_addrs.isofs.txt
    - tmp/build/100/prx_syms.isofs.txt
  reloc_addrs_path: [tmp/build/100/reloc_addrs.isofs.txt]
  asset_path: tmp/assets/100/isofs
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/100/undefined_funcs_auto.isofs.txt
  undefined_syms_auto_path: tmp/build/100/undefined_syms_auto.isofs.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8060
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x9CA0

segments:
  - [0x0, bin, elf_header]
  - name: isofs
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, isofs]
      - { start: 0x8098, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x81D0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x81D4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x81F4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x81F8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x81FC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x829C, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x82A0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x82D4, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x83A4, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x8440, .rodata, isofs]
      - { start: 0x8A20, type: prxpad, order: .rodata }
  - name: isofs_seg1
    type: code
    start: 0x8A40
    vram: 0x89A0
    bss_size: 0x1284
    subsegments:
      - [0x8A40, data, isofs_data]
      - { start: 0x8AAC, type: bss, vram: 0x8A40 }
  - [0x8AAC, bin, elf_trailer]
  - [0xC3D4]
