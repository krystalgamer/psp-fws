  target_path: tmp/baserom/100/dmacman.prx
  elf_path: tmp/build/100/dmacman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/dmacman
  src_path: src/dmacman
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/dmacman.ld
  cache_path: tmp/build/100/.splat_cache.dmacman
  symbol_addrs_path:
