      - { start: 0x1DAC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1E10, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1E14, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1E48, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1F90, type: rodata, name: nid, linker_section: .rodata.sceNid }
