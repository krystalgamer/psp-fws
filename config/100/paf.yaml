options:
  basename: paf
  target_path: tmp/baserom/100/paf.prx
  elf_path: tmp/build/100/paf.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/100/paf
  src_path: src/paf
  build_path: tmp/build/100
  ld_script_path: tmp/build/100/paf.ld
  cache_path: tmp/build/100/.splat_cache.paf
  symbol_addrs_path:
