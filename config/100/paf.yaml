      - { start: 0x1230F4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x123114, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x123118, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
