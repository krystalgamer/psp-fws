name: pspnet (150)
sha1: 65350533c0d17533c76514b25f3a8547c7949dc7
options:
  basename: pspnet
  target_path: tmp/baserom/150/pspnet.prx
  elf_path: tmp/build/150/pspnet.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/pspnet
  src_path: src/pspnet
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/pspnet.ld
  cache_path: tmp/build/150/.splat_cache.pspnet
  symbol_addrs_path:
    - config/150/symbol_addrs.pspnet.txt
    - tmp/build/150/prx_syms.pspnet.txt
  reloc_addrs_path: [tmp/build/150/reloc_addrs.pspnet.txt]
  asset_path: tmp/assets/150/pspnet
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/150/undefined_funcs_auto.pspnet.txt
  undefined_syms_auto_path: tmp/build/150/undefined_syms_auto.pspnet.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x80B0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xB6B0

segments:
  - [0x0, bin, elf_header]
  - name: pspnet
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, pspnet]
      - { start: 0x93CC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x9524, type: prxpad, order: .text }
      - { start: 0x9530, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x9534, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x9564, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x9568, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x956C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x95BC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x95C0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x95F4, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x99B8, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - { start: 0x9A64, type: rodata, name: eh_frame, linker_section: .eh_frame }
      - [0x9AC4, .rodata, pspnet]
      - { start: 0xA198, type: prxpad, order: .rodata }
  - name: pspnet_seg1
    type: code
    start: 0xA1A0
    vram: 0xA120
    bss_size: 0x14C0
    subsegments:
      - [0xA1A0, data, pspnet_data]
      - { start: 0xA260, type: bss, vram: 0xA1E0 }
  - [0xA260, bin, elf_trailer]
  - [0xEBF8]
