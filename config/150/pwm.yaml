name: pwm (150)
sha1: 1555f27b3d72c83e7e34e870cc4ec105351236a3
options:
  basename: pwm
  target_path: tmp/baserom/150/pwm.prx
  elf_path: tmp/build/150/pwm.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/pwm
  src_path: src/pwm
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/pwm.ld
  cache_path: tmp/build/150/.splat_cache.pwm
  symbol_addrs_path:
    - config/150/symbol_addrs.pwm.txt
    - tmp/build/150/prx_syms.pwm.txt
  reloc_addrs_path: [tmp/build/150/reloc_addrs.pwm.txt]
  asset_path: tmp/assets/150/pwm
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/150/undefined_funcs_auto.pwm.txt
  undefined_syms_auto_path: tmp/build/150/undefined_syms_auto.pwm.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x5A4

segments:
  - [0x0, bin, elf_header]
  - name: pwm
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, pwm]
      - { start: 0x450, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x480, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x484, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x4A4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x4A8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x4AC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x4D4, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x4D8, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x50C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x5B0, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x5C8, rodata, pwm]
  - name: pwm_seg1
    type: code
    start: 0x5D0
    vram: 0x550
    bss_size: 0x4
    subsegments:
      - [0x5D0, data, pwm_data]
      - { start: 0x610, type: bss, vram: 0x590 }
  - [0x610, bin, elf_trailer]
  - [0xD74]
