name: umdman (150)
sha1: 79f25b19a231207b6a7892877e1cee9354bdb8b7
options:
  basename: umdman
  target_path: tmp/baserom/150/umdman.prx
  elf_path: tmp/build/150/umdman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/umdman
  src_path: src/umdman
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/umdman.ld
  cache_path: tmp/build/150/.splat_cache.umdman
  symbol_addrs_path:
    - config/150/symbol_addrs.umdman.txt
    - tmp/build/150/prx_syms.umdman.txt
  reloc_addrs_path: [tmp/build/150/reloc_addrs.umdman.txt]
  asset_path: tmp/assets/150/umdman
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/150/undefined_funcs_auto.umdman.txt
  undefined_syms_auto_path: tmp/build/150/undefined_syms_auto.umdman.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x10090
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x19C88

segments:
  - [0x0, bin, elf_header]
  - name: umdman
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, umdman]
      - { start: 0xEBA0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xEF10, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xEF14, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xEF34, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xEF38, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xEF3C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xF040, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xF044, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xF078, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xF3F4, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0xF5AC, rodata, umdman]
      - { start: 0x10770, type: prxpad, order: .rodata }
  - name: umdman_seg1
    type: code
    start: 0x10780
    vram: 0x10700
    bss_size: 0x14E0
    subsegments:
      - [0x10780, data, umdman_data]
      - { start: 0x18818, type: bss, vram: 0x187C0 }
  - [0x18818, bin, elf_trailer]
  - [0x1FA38]
