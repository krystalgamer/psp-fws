  target_path: tmp/baserom/150/mediaman.prx
  elf_path: tmp/build/150/mediaman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/mediaman
  src_path: src/mediaman
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/mediaman.ld
  cache_path: tmp/build/150/.splat_cache.mediaman
  symbol_addrs_path:
