      - { start: 0xD84, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xD88, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xD8C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xDDC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
