name: ata (150)
sha1: b54d2f84e153e550a1c7c029fb99b3c551dcdc00
options:
  basename: ata
  target_path: tmp/baserom/150/ata.prx
  elf_path: tmp/build/150/ata.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/ata
  src_path: src/ata
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/ata.ld
  cache_path: tmp/build/150/.splat_cache.ata
  symbol_addrs_path:
    - config/150/symbol_addrs.ata.txt
    - tmp/build/150/prx_syms.ata.txt
  reloc_addrs_path: [tmp/build/150/reloc_addrs.ata.txt]
  asset_path: tmp/assets/150/ata
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/150/undefined_funcs_auto.ata.txt
  undefined_syms_auto_path: tmp/build/150/undefined_syms_auto.ata.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4384

segments:
  - [0x0, bin, elf_header]
  - name: ata
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, ata]
      - { start: 0x3DCC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x3E54, type: prxpad, order: .text }
      - { start: 0x3E60, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x3E64, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x3E84, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x3E88, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x3E8C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x3EDC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x3EE0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x3F14, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x4148, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x418C, .rodata, ata]
      - { start: 0x4314, type: prxpad, order: .rodata }
  - name: ata_seg1
    type: code
    start: 0x4340
    vram: 0x42A0
    bss_size: 0xD0
    subsegments:
      - [0x4340, data, ata_data]
      - { start: 0x4344, type: bss, vram: 0x42C0 }
  - [0x4344, bin, elf_trailer]
  - [0x5CD0]
