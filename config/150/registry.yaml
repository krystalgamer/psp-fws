  target_path: tmp/baserom/150/registry.prx
  elf_path: tmp/build/150/registry.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/registry
  src_path: src/registry
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/registry.ld
  cache_path: tmp/build/150/.splat_cache.registry
