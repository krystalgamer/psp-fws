      - { start: 0x4114, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x4118, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x414C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x449C, type: rodata, name: nid, linker_section: .rodata.sceNid }
