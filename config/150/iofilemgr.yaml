  target_path: tmp/baserom/150/iofilemgr.prx
  elf_path: tmp/build/150/iofilemgr.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/iofilemgr
  src_path: src/iofilemgr
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/iofilemgr.ld
  cache_path: tmp/build/150/.splat_cache.iofilemgr
  symbol_addrs_path:
