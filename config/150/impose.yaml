name: impose (150)
sha1: a7b060a8f84c6d6a60b1352bcf28944f916a1e32
options:
  basename: impose
  target_path: tmp/baserom/150/impose.prx
  elf_path: tmp/build/150/impose.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/impose
  src_path: src/impose
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/impose.ld
  cache_path: tmp/build/150/.splat_cache.impose
  symbol_addrs_path:
    - config/150/symbol_addrs.impose.txt
    - tmp/build/150/prx_syms.impose.txt
  reloc_addrs_path: [tmp/build/150/reloc_addrs.impose.txt]
  asset_path: tmp/assets/150/impose
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/150/undefined_funcs_auto.impose.txt
  undefined_syms_auto_path: tmp/build/150/undefined_syms_auto.impose.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x10E50
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xF2B4

segments:
  - [0x0, bin, elf_header]
  - name: impose
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, impose]
      - { start: 0x58A0, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x5AC0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x5AC4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x5B14, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x5B18, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x5B1C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x5C70, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x5C74, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x5CA8, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x5F74, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x6084, .rodata, impose]
      - { start: 0x62A8, type: prxpad, order: .rodata }
  - name: impose_seg1
    type: code
    start: 0x62B0
    vram: 0x6230
    bss_size: 0x21C
    subsegments:
      - [0x62B0, data, impose_data]
      - { start: 0xF108, type: bss, vram: 0xF090 }
  - [0xF108, bin, elf_trailer]
  - [0x11D00]
