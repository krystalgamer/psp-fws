name: uart4 (150)
sha1: 569f9eedcb1d20f5d080b6fa1d8807d1fbc85a4a
options:
  basename: uart4
  target_path: tmp/baserom/150/uart4.prx
  elf_path: tmp/build/150/uart4.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/150/uart4
  src_path: src/uart4
  build_path: tmp/build/150
  ld_script_path: tmp/build/150/uart4.ld
  cache_path: tmp/build/150/.splat_cache.uart4
  symbol_addrs_path:
    - config/150/symbol_addrs.uart4.txt
    - tmp/build/150/prx_syms.uart4.txt
  reloc_addrs_path: [tmp/build/150/reloc_addrs.uart4.txt]
  asset_path: tmp/assets/150/uart4
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/150/undefined_funcs_auto.uart4.txt
  undefined_syms_auto_path: tmp/build/150/undefined_syms_auto.uart4.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x7FF0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x7E4

segments:
  - [0x0, bin, elf_header]
  - name: uart4
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, uart4]
      - { start: 0x63C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x67C, type: prxpad, order: .text }
      - { start: 0x680, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x684, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x6A4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x6A8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x6AC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x6E8, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x6EC, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x720, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x7CC, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x7EC, .rodata, uart4]
  - name: uart4_seg1
    type: code
    start: 0x850
    vram: 0x7D0
    bss_size: 0x4
    subsegments:
      - { start: 0x850, type: bss, vram: 0x7D0 }
  - [0x850, bin, elf_trailer]
  - [0x10B0]
