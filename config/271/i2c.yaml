      - { start: 0x15B8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x15BC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1610, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1614, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
