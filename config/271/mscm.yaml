name: mscm (271)
sha1: a7376854ffb98abc4832770063e417d9b55c8b35
options:
  basename: mscm
  target_path: tmp/baserom/271/mscm.prx
  elf_path: tmp/build/271/mscm.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/271/mscm
  src_path: src/mscm
  build_path: tmp/build/271
  ld_script_path: tmp/build/271/mscm.ld
  cache_path: tmp/build/271/.splat_cache.mscm
  symbol_addrs_path:
    - config/271/symbol_addrs.mscm.txt
    - tmp/build/271/prx_syms.mscm.txt
  reloc_addrs_path: [tmp/build/271/reloc_addrs.mscm.txt]
  asset_path: tmp/assets/271/mscm
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/271/undefined_funcs_auto.mscm.txt
  undefined_syms_auto_path: tmp/build/271/undefined_syms_auto.mscm.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8040
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x7A40

segments:
  - [0x0, bin, elf_header]
  - name: mscm
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, mscm]
      - { start: 0x690C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x6B74, type: prxpad, order: .text }
      - { start: 0x6B80, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x6B84, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x6BA8, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x6BAC, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x6BB0, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x6CA4, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x6CA8, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x6CDC, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x6FBC, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x70F0, rodata, mscm]
      - { start: 0x72E4, type: prxpad, order: .rodata }
  - name: mscm_seg1
    type: code
    start: 0x72F0
    vram: 0x7250
    bss_size: 0x79C
    subsegments:
      - [0x72F0, data, mscm_data]
      - { start: 0x7334, type: bss, vram: 0x72A0 }
  - [0x7334, bin, elf_trailer]
  - [0x9DB4]
