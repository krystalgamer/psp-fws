name: init (300)
sha1: c2ba7f73bb41a7c74849e26e7433e11bef745166
options:
  basename: init
  target_path: tmp/baserom/300/init.prx
  elf_path: tmp/build/300/init.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/300/init
  src_path: src/init
  build_path: tmp/build/300
  ld_script_path: tmp/build/300/init.ld
  cache_path: tmp/build/300/.splat_cache.init
  symbol_addrs_path:
    - config/300/symbol_addrs.init.txt
    - tmp/build/300/prx_syms.init.txt
  reloc_addrs_path: [tmp/build/300/reloc_addrs.init.txt]
  asset_path: tmp/assets/300/init
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/300/undefined_funcs_auto.init.txt
  undefined_syms_auto_path: tmp/build/300/undefined_syms_auto.init.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1F14

segments:
  - [0x0, bin, elf_header]
  - name: init
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, init]
      - { start: 0x16BC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x183C, type: prxpad, order: .text }
      - { start: 0x1840, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1844, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1864, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1868, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x186C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1920, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1924, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1958, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1AA4, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1B64, rodata, init]
      - { start: 0x1DC4, type: prxpad, order: .rodata }
  - name: init_seg1
    type: code
    start: 0x1DD0
    vram: 0x1D30
    bss_size: 0x1D0
    subsegments:
      - [0x1DD0, data, init_data]
      - { start: 0x1DD4, type: bss, vram: 0x1D40 }
  - [0x1DD4, bin, elf_trailer]
  - [0x31D4]
