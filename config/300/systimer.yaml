name: systimer (300)
sha1: 2380ae53981d2fbbb11c69d24e3ae008e14459e2
options:
  basename: systimer
  target_path: tmp/baserom/300/systimer.prx
  elf_path: tmp/build/300/systimer.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/300/systimer
  src_path: src/systimer
  build_path: tmp/build/300
  ld_script_path: tmp/build/300/systimer.ld
  cache_path: tmp/build/300/.splat_cache.systimer
  symbol_addrs_path:
    - config/300/symbol_addrs.systimer.txt
    - tmp/build/300/prx_syms.systimer.txt
  reloc_addrs_path: [tmp/build/300/reloc_addrs.systimer.txt]
  asset_path: tmp/assets/300/systimer
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/300/undefined_funcs_auto.systimer.txt
  undefined_syms_auto_path: tmp/build/300/undefined_syms_auto.systimer.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8080
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xBF0

segments:
  - [0x0, bin, elf_header]
  - name: systimer
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, systimer]
      - { start: 0xA00, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xA48, type: prxpad, order: .text }
      - { start: 0xA50, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xA54, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xA74, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xA78, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xA7C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xAA8, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xAAC, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xAE0, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xB94, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - { start: 0xBB8, type: prxpad, order: .rodata }
  - name: systimer_seg1
    type: code
    start: 0xBC0
    vram: 0xB20
    bss_size: 0x38
    subsegments:
      - [0xBC0, data, systimer_data]
      - { start: 0xC48, type: bss, vram: 0xBB0 }
  - [0xC48, bin, elf_trailer]
  - [0x14A8]
