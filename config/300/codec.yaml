name: codec (300)
sha1: da7c0ffad7ca1084f226ab0259ba5799b7cbee51
options:
  basename: codec
  target_path: tmp/baserom/300/codec.prx
  elf_path: tmp/build/300/codec.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/300/codec
  src_path: src/codec
  build_path: tmp/build/300
  ld_script_path: tmp/build/300/codec.ld
  cache_path: tmp/build/300/.splat_cache.codec
  symbol_addrs_path:
    - config/300/symbol_addrs.codec.txt
    - tmp/build/300/prx_syms.codec.txt
  reloc_addrs_path: [tmp/build/300/reloc_addrs.codec.txt]
  asset_path: tmp/assets/300/codec
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/300/undefined_funcs_auto.codec.txt
  undefined_syms_auto_path: tmp/build/300/undefined_syms_auto.codec.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x80B0
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1170

segments:
  - [0x0, bin, elf_header]
  - name: codec
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, codec]
      - { start: 0xE3C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xEA4, type: prxpad, order: .text }
      - { start: 0xEB0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xEB4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xED4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xED8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xEDC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xF40, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xF44, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xF78, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1084, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x10B8, rodata, codec]
  - name: codec_seg1
    type: code
    start: 0x1140
    vram: 0x10A0
    subsegments:
      - [0x1140, data, codec_data]
  - [0x1200, bin, elf_trailer]
  - [0x1DD8]
