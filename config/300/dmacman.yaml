name: dmacman (300)
sha1: d2484a8c675114a27eba74d1d5fca9af8e5e5b1f
options:
  basename: dmacman
  target_path: tmp/baserom/300/dmacman.prx
  elf_path: tmp/build/300/dmacman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/300/dmacman
  src_path: src/dmacman
  build_path: tmp/build/300
  ld_script_path: tmp/build/300/dmacman.ld
  cache_path: tmp/build/300/.splat_cache.dmacman
  symbol_addrs_path:
    - config/300/symbol_addrs.dmacman.txt
    - tmp/build/300/prx_syms.dmacman.txt
  reloc_addrs_path: [tmp/build/300/reloc_addrs.dmacman.txt]
  asset_path: tmp/assets/300/dmacman
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/300/undefined_funcs_auto.dmacman.txt
  undefined_syms_auto_path: tmp/build/300/undefined_syms_auto.dmacman.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4090

segments:
  - [0x0, bin, elf_header]
  - name: dmacman
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, dmacman]
      - { start: 0x1CC4, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x1D3C, type: prxpad, order: .text }
      - { start: 0x1D40, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1D44, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1D68, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1D6C, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x1D70, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1DD8, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1DDC, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1E10, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1F90, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1FCC, rodata, dmacman]
      - { start: 0x202C, type: prxpad, order: .rodata }
  - name: dmacman_seg1
    type: code
    start: 0x2040
    vram: 0x1FC0
    bss_size: 0x20BC
    subsegments:
      - [0x2040, data, dmacman_data]
      - { start: 0x2044, type: bss, vram: 0x2000 }
  - [0x2044, bin, elf_trailer]
  - [0x2CC8]
