name: registry (300)
sha1: 1ad390747146d02eacfd6361c7f06a6090a91d7b
options:
  basename: registry
  target_path: tmp/baserom/300/registry.prx
  elf_path: tmp/build/300/registry.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/300/registry
  src_path: src/registry
  build_path: tmp/build/300
  ld_script_path: tmp/build/300/registry.ld
  cache_path: tmp/build/300/.splat_cache.registry
  symbol_addrs_path:
    - config/300/symbol_addrs.registry.txt
    - tmp/build/300/prx_syms.registry.txt
  reloc_addrs_path: [tmp/build/300/reloc_addrs.registry.txt]
  asset_path: tmp/assets/300/registry
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/300/undefined_funcs_auto.registry.txt
  undefined_syms_auto_path: tmp/build/300/undefined_syms_auto.registry.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x7004

segments:
  - [0x0, bin, elf_header]
  - name: registry
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, registry]
      - { start: 0x6B84, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x6C5C, type: prxpad, order: .text }
      - { start: 0x6C60, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x6C64, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x6C9C, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x6CA0, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x6CA4, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x6D08, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x6D0C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x6D40, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x6F7C, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x6FE8, rodata, registry]
      - { start: 0x7054, type: prxpad, order: .rodata }
  - name: registry_seg1
    type: code
    start: 0x7060
    vram: 0x6FC0
    bss_size: 0x28
    subsegments:
      - [0x7060, data, registry_data]
      - { start: 0x706C, type: bss, vram: 0x6FD0 }
  - [0x706C, bin, elf_trailer]
  - [0x8E48]
