      - { start: 0xE380, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xE384, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xE3B8, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xE858, type: rodata, name: nid, linker_section: .rodata.sceNid }
