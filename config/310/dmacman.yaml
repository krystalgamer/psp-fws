name: dmacman (310)
sha1: e42a04c2f494b40b8de092c465c52e2d125e058a
options:
  basename: dmacman
  target_path: tmp/baserom/310/dmacman.prx
  elf_path: tmp/build/310/dmacman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/310/dmacman
  src_path: src/dmacman
  build_path: tmp/build/310
  ld_script_path: tmp/build/310/dmacman.ld
  cache_path: tmp/build/310/.splat_cache.dmacman
  symbol_addrs_path:
    - config/310/symbol_addrs.dmacman.txt
    - tmp/build/310/prx_syms.dmacman.txt
  reloc_addrs_path: [tmp/build/310/reloc_addrs.dmacman.txt]
  asset_path: tmp/assets/310/dmacman
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/310/undefined_funcs_auto.dmacman.txt
  undefined_syms_auto_path: tmp/build/310/undefined_syms_auto.dmacman.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x40D0

segments:
  - [0x0, bin, elf_header]
  - name: dmacman
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, c, dmacman]
      - { start: 0x1D1C, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x1D94, type: prxpad, order: .text }
      - { start: 0x1DA0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1DA4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1DC8, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1DCC, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x1DD0, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1E38, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1E3C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1E70, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1FF8, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x2034, .rodata, dmacman]
      - { start: 0x2094, type: prxpad, order: .rodata }
  - name: dmacman_seg1
    type: code
    start: 0x20C0
    vram: 0x2000
    bss_size: 0x20BC
    subsegments:
      - [0x20C0, data, dmacman_data]
      - { start: 0x20C4, type: bss, vram: 0x2040 }
  - [0x20C4, bin, elf_trailer]
  - [0x2D60]
