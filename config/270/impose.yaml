      - { start: 0x5DE8, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x5DEC, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x5DF0, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x5F34, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x5F38, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x5F6C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x6264, type: rodata, name: nid, linker_section: .rodata.sceNid }
