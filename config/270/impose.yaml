  target_path: tmp/baserom/270/impose.prx
  elf_path: tmp/build/270/impose.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/270/impose
  src_path: src/impose
  build_path: tmp/build/270
  ld_script_path: tmp/build/270/impose.ld
  cache_path: tmp/build/270/.splat_cache.impose
  symbol_addrs_path:
