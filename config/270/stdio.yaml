name: stdio (270)
sha1: a2d6a13b4a1d6520496a79d13e72ce0de9751dbd
options:
  basename: stdio
  target_path: tmp/baserom/270/stdio.prx
  elf_path: tmp/build/270/stdio.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/270/stdio
  src_path: src/stdio
  build_path: tmp/build/270
  ld_script_path: tmp/build/270/stdio.ld
  cache_path: tmp/build/270/.splat_cache.stdio
  symbol_addrs_path:
    - config/270/symbol_addrs.stdio.txt
    - tmp/build/270/prx_syms.stdio.txt
  reloc_addrs_path: [tmp/build/270/reloc_addrs.stdio.txt]
  asset_path: tmp/assets/270/stdio
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/270/undefined_funcs_auto.stdio.txt
  undefined_syms_auto_path: tmp/build/270/undefined_syms_auto.stdio.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8000
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1620

segments:
  - [0x0, bin, elf_header]
  - name: stdio
    type: code
    start: 0xA0
    vram: 0x0
    subsegments:
      - [0xA0, asm, stdio]
      - { start: 0x11CC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x126C, type: prxpad, order: .text }
      - { start: 0x1270, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1274, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x12A8, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x12AC, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x12B0, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1314, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1318, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x134C, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x14FC, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x154C, rodata, stdio]
      - { start: 0x1678, type: prxpad, order: .rodata }
  - name: stdio_seg1
    type: code
    start: 0x1680
    vram: 0x15E0
    bss_size: 0x24
    subsegments:
      - [0x1680, data, stdio_data]
      - { start: 0x168C, type: bss, vram: 0x15F0 }
  - [0x168C, bin, elf_trailer]
  - [0x280C]
