name: mscm (201)
sha1: c59879d2129fcf1e7754a6c137ea78af6f58c76b
options:
  basename: mscm
  target_path: tmp/baserom/201/mscm.prx
  elf_path: tmp/build/201/mscm.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/201/mscm
  src_path: src/mscm
  build_path: tmp/build/201
  ld_script_path: tmp/build/201/mscm.ld
  cache_path: tmp/build/201/.splat_cache.mscm
  symbol_addrs_path:
    - config/201/symbol_addrs.mscm.txt
    - tmp/build/201/prx_syms.mscm.txt
  reloc_addrs_path: [tmp/build/201/reloc_addrs.mscm.txt]
  asset_path: tmp/assets/201/mscm
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/201/undefined_funcs_auto.mscm.txt
  undefined_syms_auto_path: tmp/build/201/undefined_syms_auto.mscm.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8190
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x77A6

segments:
  - [0x0, bin, elf_header]
  - name: mscm
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, mscm]
      - { start: 0x6654, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x68CC, type: prxpad, order: .text }
      - { start: 0x68D0, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x68D4, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x68F4, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x68F8, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x68FC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x69F0, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x69F4, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x6A28, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x6CE8, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x6E24, .rodata, mscm]
      - { start: 0x6EC8, type: prxpad, order: .rodata }
  - name: mscm_seg1
    type: code
    start: 0x6ED0
    vram: 0x6E50
    bss_size: 0x7AE
    subsegments:
      - [0x6ED0, data, mscm_data]
      - { start: 0x7068, type: bss, vram: 0x6FF0 }
  - [0x7068, bin, elf_trailer]
  - [0x9B80]
