name: sircs (260)
sha1: ff56c38d6d530137af91c75d1ffe414a54c60a1f
options:
  basename: sircs
  target_path: tmp/baserom/260/sircs.prx
  elf_path: tmp/build/260/sircs.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/sircs
  src_path: src/sircs
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/sircs.ld
  cache_path: tmp/build/260/.splat_cache.sircs
  symbol_addrs_path:
    - config/260/symbol_addrs.sircs.txt
    - tmp/build/260/prx_syms.sircs.txt
  reloc_addrs_path: [tmp/build/260/reloc_addrs.sircs.txt]
  asset_path: tmp/assets/260/sircs
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/260/undefined_funcs_auto.sircs.txt
  undefined_syms_auto_path: tmp/build/260/undefined_syms_auto.sircs.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x2088

segments:
  - [0x0, bin, elf_header]
  - name: sircs
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, sircs]
      - { start: 0x1BAC, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x1CF4, type: prxpad, order: .text }
      - { start: 0x1D00, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x1D04, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x1D34, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1D38, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x1D3C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1DCC, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1DD0, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1E04, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1F08, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x1FAC, .rodata, sircs]
      - { start: 0x2044, type: prxpad, order: .rodata }
  - name: sircs_seg1
    type: code
    start: 0x2050
    vram: 0x1FD0
    bss_size: 0x68
    subsegments:
      - [0x2050, data, sircs_data]
      - { start: 0x2090, type: bss, vram: 0x2010 }
  - [0x2090, bin, elf_trailer]
  - [0x318C]
