      - { start: 0xF00, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xF04, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xF34, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xF38, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xF3C, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xF8C, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xF90, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xFC4, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x10B0, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x10E0, .rodata, videocodec]
      - { start: 0x110C, type: prxpad, order: .rodata }
