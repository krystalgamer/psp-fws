  elf_path: tmp/build/260/videocodec.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/videocodec
  src_path: src/videocodec
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/videocodec.ld
  cache_path: tmp/build/260/.splat_cache.videocodec
  symbol_addrs_path:
