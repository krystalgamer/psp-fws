name: umdman (260)
sha1: a9ef11018c6d4052cfa74ccf5e5f0c64afaaa341
options:
  basename: umdman
  target_path: tmp/baserom/260/umdman.prx
  elf_path: tmp/build/260/umdman.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/umdman
  src_path: src/umdman
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/umdman.ld
  cache_path: tmp/build/260/.splat_cache.umdman
  symbol_addrs_path:
    - config/260/symbol_addrs.umdman.txt
    - tmp/build/260/prx_syms.umdman.txt
  reloc_addrs_path: [tmp/build/260/reloc_addrs.umdman.txt]
  asset_path: tmp/assets/260/umdman
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/260/undefined_funcs_auto.umdman.txt
  undefined_syms_auto_path: tmp/build/260/undefined_syms_auto.umdman.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8080
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1D10C

segments:
  - [0x0, bin, elf_header]
  - name: umdman
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, umdman]
      - { start: 0x10E08, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x111F8, type: prxpad, order: .text }
      - { start: 0x11200, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x11204, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x11228, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x1122C, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x11230, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x11388, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1138C, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x113C0, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x11840, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x11A38, .rodata, umdman]
      - { start: 0x12B94, type: prxpad, order: .rodata }
  - name: umdman_seg1
    type: code
    start: 0x12BC0
    vram: 0x12B40
    bss_size: 0xA52C
    subsegments:
      - [0x12BC0, data, umdman_data]
      - { start: 0x12C50, type: bss, vram: 0x12C00 }
  - [0x12C50, bin, elf_trailer]
  - [0x1AF64]
