name: lcdc (260)
sha1: d038af25e85f36ee3e6f102b21eaeeeca7418530
options:
  basename: lcdc
  target_path: tmp/baserom/260/lcdc.prx
  elf_path: tmp/build/260/lcdc.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/lcdc
  src_path: src/lcdc
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/lcdc.ld
  cache_path: tmp/build/260/.splat_cache.lcdc
  symbol_addrs_path:
    - config/260/symbol_addrs.lcdc.txt
    - tmp/build/260/prx_syms.lcdc.txt
  reloc_addrs_path: [tmp/build/260/reloc_addrs.lcdc.txt]
  asset_path: tmp/assets/260/lcdc
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/260/undefined_funcs_auto.lcdc.txt
  undefined_syms_auto_path: tmp/build/260/undefined_syms_auto.lcdc.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0xEEC

segments:
  - [0x0, bin, elf_header]
  - name: lcdc
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, c, lcdc]
      - { start: 0xC28, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0xC70, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0xC74, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0xC98, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0xC9C, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0xCA0, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0xCE0, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0xCE4, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0xD18, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0xE34, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0xE58, .rodata, lcdc]
  - name: lcdc_seg1
    type: code
    start: 0xEF0
    vram: 0xE70
    bss_size: 0x2C
    subsegments:
      - [0xEF0, data, lcdc_data]
      - { start: 0xF30, type: bss, vram: 0xEB0 }
  - [0xF30, bin, elf_trailer]
  - [0x1964]
