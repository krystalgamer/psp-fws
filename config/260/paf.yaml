      - { start: 0x167138, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x16713C, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x167140, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x167280, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x167284, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1672B8, type: rodata, name: resident, linker_section: .rodata.sceResident }
