options:
  basename: paf
  target_path: tmp/baserom/260/paf.prx
  elf_path: tmp/build/260/paf.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/paf
  src_path: src/paf
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/paf.ld
  cache_path: tmp/build/260/.splat_cache.paf
  symbol_addrs_path:
    - config/260/symbol_addrs.paf.txt
    - tmp/build/260/prx_syms.paf.txt
  reloc_addrs_path: [tmp/build/260/reloc_addrs.paf.txt]
  asset_path: tmp/assets/260/paf
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/260/undefined_funcs_auto.paf.txt
  undefined_syms_auto_path: tmp/build/260/undefined_syms_auto.paf.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0xA230
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x1EC08C

