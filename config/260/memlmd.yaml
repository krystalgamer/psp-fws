  elf_path: tmp/build/260/memlmd.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/memlmd
  src_path: src/memlmd
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/memlmd.ld
  cache_path: tmp/build/260/.splat_cache.memlmd
  symbol_addrs_path:
