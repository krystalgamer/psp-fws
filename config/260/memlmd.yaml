      - { start: 0x1BDC, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x1C30, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x1C34, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x1C68, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x1D44, type: rodata, name: nid, linker_section: .rodata.sceNid }
