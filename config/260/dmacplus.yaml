name: dmacplus (260)
sha1: 3c3df1f05a6ed679c139226cec6a768b4fa39e7c
options:
  basename: dmacplus
  target_path: tmp/baserom/260/dmacplus.prx
  elf_path: tmp/build/260/dmacplus.elf
  base_path: ../..
  platform: psp
  compiler: GCC

  asm_path: tmp/asm/260/dmacplus
  src_path: src/dmacplus
  build_path: tmp/build/260
  ld_script_path: tmp/build/260/dmacplus.ld
  cache_path: tmp/build/260/.splat_cache.dmacplus
  symbol_addrs_path:
    - config/260/symbol_addrs.dmacplus.txt
    - tmp/build/260/prx_syms.dmacplus.txt
  reloc_addrs_path: [tmp/build/260/reloc_addrs.dmacplus.txt]
  asset_path: tmp/assets/260/dmacplus
  extensions_path: tools/splat_ext
  undefined_funcs_auto_path: tmp/build/260/undefined_funcs_auto.dmacplus.txt
  undefined_syms_auto_path: tmp/build/260/undefined_syms_auto.dmacplus.txt

  find_file_boundaries: true
  section_order: [".text", ".data", ".rodata", ".bss"]
  migrate_rodata_to_functions: true
  use_legacy_include_asm: false
  asm_function_macro: glabel
  asm_jtbl_label_macro: jlabel
  asm_data_macro: dlabel
  asm_end_label: endlabel
  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2
  gp_value: 0x8030
  add_set_gp_64: false
  named_regs_for_c_funcs: false
  ld_bss_is_noload: true
  emit_subalign: false
  ld_align_segment_vram_end: false
  ld_align_section_vram_end: false
  disasm_unknown: true
  global_vram_start: 0x0
  global_vram_end: 0x4020

segments:
  - [0x0, bin, elf_header]
  - name: dmacplus
    type: code
    start: 0x80
    vram: 0x0
    subsegments:
      - [0x80, asm, dmacplus]
      - { start: 0x2A14, type: asm, name: sceStub, linker_section: .sceStub.text }
      - { start: 0x2AF4, type: prxpad, order: .text }
      - { start: 0x2B00, type: rodata, name: lib_ent_top, linker_section: .lib.ent.top }
      - { start: 0x2B04, type: rodata, name: lib_ent, linker_section: .lib.ent }
      - { start: 0x2B38, type: rodata, name: lib_ent_btm, linker_section: .lib.ent.btm }
      - { start: 0x2B3C, type: rodata, name: lib_stub_top, linker_section: .lib.stub.top }
      - { start: 0x2B40, type: rodata, name: lib_stub, linker_section: .lib.stub }
      - { start: 0x2BA8, type: rodata, name: lib_stub_btm, linker_section: .lib.stub.btm }
      - { start: 0x2BAC, type: rodata, name: module_info, linker_section: .rodata.sceModuleInfo }
      - { start: 0x2BE0, type: rodata, name: resident, linker_section: .rodata.sceResident }
      - { start: 0x2E70, type: rodata, name: nid, linker_section: .rodata.sceNid }
      - [0x2EE0, rodata, dmacplus]
      - { start: 0x2F70, type: prxpad, order: .rodata }
  - name: dmacplus_seg1
    type: code
    start: 0x2F80
    vram: 0x2F00
    bss_size: 0x10D0
    subsegments:
      - [0x2F80, data, dmacplus_data]
      - { start: 0x2FC0, type: bss, vram: 0x2F40 }
  - [0x2FC0, bin, elf_trailer]
  - [0x4864]
